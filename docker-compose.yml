services:
  mysql:
    # Stands in for the billing system that produced the CSV exports.
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: billing
      MYSQL_USER: billing_user
      MYSQL_PASSWORD: billing_password
    ports:
      - "127.0.0.1:${NORDSTACK_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "billing_user", "-pbilling_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dbt_user
      POSTGRES_PASSWORD: dbt_password
      POSTGRES_DB: analytics
    ports:
      - "127.0.0.1:${NORDSTACK_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbt_user -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysqldata:
  pgdata:
