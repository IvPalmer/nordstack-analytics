name: nordstack_analytics
version: 1.0.0
config-version: 2
profile: nordstack_analytics
require-dbt-version: [">=1.11.0", "<2.0.0"]

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Reporting cutoff: the last invoice date in the export. Keeps every
  # "current" and "future" rule stable until a new export arrives.
  as_of_date: "2026-07-28"
  # Reporting currency is EUR. Approximate 2025-2026 rates; a currency
  # missing here is a reject reason, not a silent zero.
  fx_rates_to_eur:
    EUR: 1.0
    SEK: 0.087

models:
  nordstack_analytics:
    staging:
      +materialized: view
      +schema: staging
    quarantine:
      +materialized: view
      +schema: quarantine
    intermediate:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
